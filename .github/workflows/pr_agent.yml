name: AI PR Reviewer

# Calls the org's shared reviewer (Qodo PR-Agent on Claude):
# https://github.com/epiphanyapps/.github/blob/main/.github/workflows/pr-agent-review.yml
# Manual commands in any PR comment: /review  /describe  /improve  /ask "..."
# Needs the ANTHROPIC_KEY repo secret; the run fails if no review is posted.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    uses: epiphanyapps/.github/.github/workflows/pr-agent-review.yml@v1
    with:
      extra_instructions: >-
        Public Next.js marketing site with a CMS on AWS Amplify: flag SEO and
        Lighthouse regressions (indexable content rendered client-only,
        missing metadata, unoptimized images or blocking scripts), CMS writes
        that are not behind auth, and any committed secret or API key.
    secrets:
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
